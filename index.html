const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36), day=86400000, today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, dt=s=>new Date(s+'T00:00:00'), diff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/day), add=(s,n)=>new Date(Date.parse(s)+n*day).toISOString().slice(0,10), week=s=>add(s,-((new Date(s+'T12:00:00').getDay()+6)%7)), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=n=>Number.isFinite(n)?n.toFixed(1):'—';
const initial={active:'2026',theme:'dark',animations:true,challenges:[{id:'2026',name:'2026 Challenge',goal:324,start:'2026-09-01',end:'2026-12-27',entries:[{id:'opening',qty:246,status:'received',date:'2026-11-24',opening:true,notes:'Opening balance; individual receipt dates unknown'},{id:'pending',qty:18,status:'pending',date:'2026-12-05',notes:'Three booster bundles'}],rewards:[],earned:{}},{id:'2027',name:'2027 Challenge',goal:1000,start:'2026-12-28',end:'2027-12-27',entries:[],rewards:[],earned:{}}]};let state;try{state=JSON.parse(localStorage.getItem('birthday-vault-v1'))||initial}catch{state=initial}let tab='Home',filter='all';const C=()=>state.challenges.find(c=>c.id===state.active)||state.challenges[0], received=c=>c.entries.filter(e=>e.status==='received'), sum=a=>a.reduce((n,e)=>n+e.qty,0), total=c=>sum(received(c)), pending=c=>sum(c.entries.filter(e=>e.status==='pending')), remaining=c=>Math.max(0,c.goal-total(c)), days=c=>Math.max(0,diff(c.end,today())), elapsed=c=>Math.max(0,Math.min(diff(c.end,c.start)+1,diff(today(),c.start)+1)), pace=c=>remaining(c)===0?0:days(c)?remaining(c)/days(c)*7:NaN, groups=(c,kind)=>{let o={};received(c).filter(e=>!e.opening).forEach(e=>{let k=kind==='week'?week(e.date):e.date.slice(0,7);o[k]=(o[k]||0)+e.qty});return Object.entries(o).sort((a,b)=>a[0].localeCompare(b[0]))};
const awards=[['first','📦','The Beginning','Collect your first pack',c=>total(c)>=1],['100','⭐','Triple Digits','Collect 100 packs',c=>total(c)>=100],['quarter','💗','Quarter of the Way','Reach 25% of your goal',c=>total(c)>=c.goal*.25],['half','💎','Halfway There','Reach 50% of your goal',c=>total(c)>=c.goal*.5],['75','🌸','Blooming Vault','Reach 75% of your goal',c=>total(c)>=c.goal*.75],['goal','👑','Pack Royalty','Reach your goal',c=>total(c)>=c.goal],['secret','🎀','Special Delivery','Receive a pending order',c=>received(c).some(e=>e.delivered),true],['secret2','✨','Little by Little','Log on 10 different receipt dates',c=>new Set(received(c).filter(e=>!e.opening).map(e=>e.date)).size>=10,true]];
function save(celebrate=false){let fresh=false;state.challenges.forEach(c=>{c.earned??={};awards.forEach(([id,icon,name,desc,test])=>{if(test(c)&&!c.earned[id]){c.earned[id]=today();fresh=true}})});try{localStorage.setItem('birthday-vault-v1',JSON.stringify(state))}catch{alert('Local saving failed. Export a backup now.')}if(fresh&&celebrate&&state.animations)confetti();render()}
function confetti(){for(let i=0;i<35;i++){let x=document.createElement('span');x.className='confetti';x.textContent=['♡','✧','🌸'][i%3];x.style.left=Math.random()*100+'vw';x.style.color='#f8a8cf';x.style.animationDelay=Math.random()*.6+'s';document.body.append(x);setTimeout(()=>x.remove(),2800)}}
const navIcons=["<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 10 9-7 9 7v11h-6v-7H9v7H3z\"/></svg>", "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 9 5v9l-9 5-9-5V8z M3 8l9 5 9-5 M12 13v9 M7.5 5.5l9 5\"/></svg>", "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V12h4v8 M10 20V7h4v13 M16 20V3h4v17\"/></svg>", "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/><path d=\"M5 12v9h14v-9 M12 8v13 M12 8C3 8 5 0 9 4l3 4c9 0 7-8 3-4z\"/></svg>", "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3h8v6a4 4 0 0 1-8 0z M8 5H4v3a4 4 0 0 0 4 4 M16 5h4v3a4 4 0 0 1-4 4 M12 13v5 M7 21h10 M9 18h6\"/></svg>"];function go(t){tab=t;render()}function metric(l,v){return `<div class="metric"><small>${l}</small><b>${v}</b></div>`}function render(){document.body.classList.toggle('light',state.theme==='light');let c=C(),n=total(c),pct=n/c.goal*100; $('challenge').innerHTML=state.challenges.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('');$('nav').innerHTML=['Home','Vault','Stats','Rewards','Awards'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span>${navIcons[i]}</span>${t}</button>`).join('');let h='';if(tab==='Home'){let next=c.rewards.filter(r=>r.at>n&&!r.claimed).sort((a,b)=>a.at-b.at)[0];h=`<div class="ring"><svg class="progress" viewBox="0 0 220 220"><defs><linearGradient id="pinkRing" x2="1" y2="1"><stop stop-color="#ffe1ef"/><stop offset="1" stop-color="#e77eaf"/></linearGradient></defs><circle cx="110" cy="110" r="99" stroke="#654253" stroke-width="10" fill="none"/><circle cx="110" cy="110" r="99" stroke="url(#pinkRing)" stroke-width="10" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.min(100,pct)} 100" transform="rotate(-90 110 110)" opacity="${pct>0?1:0}"/></svg><div><b>${n.toLocaleString()}</b><small>OF ${c.goal.toLocaleString()} PACKS</small><p>${fmt(pct)}% complete ♡</p></div></div><div class="panel" style="text-align:center"><small>Birthday countdown</small><h2 id="countdown"></h2></div><div class="grid">${metric('Packs remaining',remaining(c))}${metric('Pending delivery',pending(c))}${metric('Received this week',sum(received(c).filter(e=>!e.opening&&week(e.date)===week(today()))))}${metric('Required weekly pace',fmt(pace(c)))}</div><div class="panel">${next?`Next reward: ${esc(next.icon)} ${esc(next.name)} · ${next.at-n} packs away`:'Create a little milestone reward in Rewards ♡'}</div><button class="wide" onclick="entry()">＋ Add packs</button>${received(c).some(e=>e.opening)?'<p class="muted">Weekly totals exclude the opening balance with unknown receipt dates.</p>':''}`}
if(tab==='Vault'){let entries=c.entries.filter(e=>filter==='all'||filter==='pending'&&e.status==='pending'||filter==='week'&&e.status==='received'&&!e.opening&&week(e.date)===week(today())||filter==='month'&&e.status==='received'&&!e.opening&&e.date.slice(0,7)===today().slice(0,7));h=`<h2>Your vault</h2><button class="wide" onclick="entry()">＋ Add packs or order</button><select aria-label="Filter entries" onchange="filter=this.value;render()">${[['all','All entries'],['pending','Pending'],['week','This week'],['month','This month']].map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select>`+entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="panel"><div class="row"><div><b>${e.qty} packs · ${e.opening?'Opening balance':e.status==='pending'?'Pending':'Received'}</b><br><small>${e.status==='pending'?'Expected ':''}${esc(e.date)} ${esc(e.source||'')}</small></div><button class="secondary" onclick="entry('${e.id}')">Edit</button></div><p>${esc(e.notes)}</p>${e.status==='pending'?`<button onclick="receive('${e.id}')">Mark received</button> `:''}<button class="secondary" onclick="removeEntry('${e.id}')">Delete</button></div>`).join('');if(!entries.length)h+='<p>No entries here yet.</p>'}
if(tab==='Stats'){let el=elapsed(c),avg=el?n/el:NaN,expected=c.goal*el/(diff(c.end,c.start)+1),w=groups(c,'week'),m=groups(c,'month');h=`<h2>Collection stats</h2><div class="grid">${metric('Daily average',fmt(avg))}${metric('Weekly average',fmt(avg*7))}${metric('Monthly average (30.44 days)',fmt(avg*30.44))}${metric('Required daily pace',fmt(pace(c)/7))}${metric('Required weekly pace',fmt(pace(c)))}${metric('Projected birthday total',Number.isFinite(avg)?Math.round(avg*(diff(c.end,c.start)+1)):'—')}${metric('Schedule difference',`${Math.round(Math.abs(n-expected))} ${n>=expected?'ahead':'behind'}`)}${metric('Best logged week',w.length?Math.max(...w.map(x=>x[1])):'—')}${metric('Best logged month',m.length?Math.max(...m.map(x=>x[1])):'—')}</div><p class="muted">Averages use elapsed calendar days, including today; projections assume that pace continues. Opening balance counts in overall averages but not weekly/monthly history.</p>${bars('Weekly receipts',w)}${bars('Monthly receipts',m)}${line(c)}<div class="panel"><h3>Compare challenges</h3>${state.challenges.map(x=>`<p>${esc(x.name)}: ${total(x)} / ${x.goal} (${fmt(total(x)/x.goal*100)}%)</p>`).join('')}</div><div class="panel"><h3>What if?</h3><label>Additional packs (including any pending you choose)</label><input id="hyp" type="number" min="0" value="${pending(c)}" oninput="hyp()"><label>Projection date</label><input id="hypdate" type="date" value="${today()}" oninput="hyp()"><p id="hypout"></p></div>`}
if(tab==='Rewards'){h=`<h2>Milestone rewards</h2><button class="wide" onclick="reward()">＋ Create reward</button>`+c.rewards.slice().sort((a,b)=>a.at-b.at).map(r=>`<div class="panel"><div class="row"><div><b>${esc(r.icon)} ${esc(r.name)}</b><p>${r.at} packs · ${r.claimed?'Claimed ♡':n>=r.at?'Ready to enjoy!':`${r.at-n} packs away`}</p></div><button class="secondary" onclick="reward('${r.id}')">Edit</button></div>${n>=r.at?`<button onclick="claim('${r.id}')">${r.claimed?'Unclaim':'Mark claimed'}</button> `:''}<button class="secondary" onclick="deleteReward('${r.id}')">Delete</button></div>`).join('')+`<div class="panel"><h3>Reward inspiration</h3>${['Cozy gaming night','Favorite dessert','Movie night','At-home spa day','A hobby afternoon','Birthday opening setup'].map(s=>`<p>${s} <button class="secondary" onclick="reward(null,'${s}')">＋</button></p>`).join('')}</div>`}
if(tab==='Awards'){h=`<h2>Achievement collection</h2><p>${Object.keys(c.earned).length} / ${awards.length} unlocked · ${fmt(Object.keys(c.earned).length/awards.length*100)}%</p><div class="grid">`+awards.map(([id,i,name,d,test,secret])=>`<div class="metric ${c.earned[id]?'':'locked'}"><span class="badge">${secret&&!c.earned[id]?'❔':i}</span><h3>${secret&&!c.earned[id]?'Secret achievement':name}</h3><small>${secret&&!c.earned[id]?'A surprise awaits':d}</small><p>${c.earned[id]?'Unlocked '+c.earned[id]:'Locked'}</p></div>`).join('')+'</div>'}
if(tab==='Settings'){h=`<h2>Settings</h2><div class="panel"><button onclick="challengeEdit()">＋ New challenge</button> <button class="secondary" onclick="challengeEdit(true)">Edit current challenge</button><p><button onclick="state.theme=state.theme==='dark'?'light':'dark';save()">Switch to ${state.theme==='dark'?'light':'dark'} pink</button></p><label><input style="width:auto" type="checkbox" ${state.animations?'checked':''} onchange="state.animations=this.checked;save()"> Celebration animations</label></div><div class="panel"><h3>Backups</h3><p>Data saves on this browser only. Export regularly and before changing phones or clearing browser data.</p><button onclick="backup()">Export backup</button><p><label>Import backup (replaces current data)</label><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></p></div><p class="muted">The Birthday Vault v1.0 · No financial tracking.</p>`}$('view').innerHTML=h;tick();if(tab==='Stats')hyp()}
function bars(title,a){let max=Math.max(1,...a.map(x=>x[1]));return `<div class="panel"><h3>${title}</h3><div class="chart">${a.map(([k,v])=>`<div class="chartrow"><span>${k}</span><div class="bar" style="width:${v/max*100}%"></div><span>${v}</span></div>`).join('')||'No dated receipts yet.'}</div></div>`}function line(c){let a=received(c).slice().sort((a,b)=>a.date.localeCompare(b.date)),n=0,max=Math.max(c.goal,total(c)),span=Math.max(1,diff(c.end,c.start));let points=a.map(e=>{n+=e.qty;return `${20+280*Math.max(0,Math.min(1,diff(e.date,c.start)/span))},${140-120*n/max}`});return `<div class="panel"><h3>Overall progress</h3><svg viewBox="0 0 320 160" role="img" aria-label="Cumulative pack count"><path d="M20 20V140H300" fill="none" stroke="#a77c92"/><path d="M20 ${140-120*c.goal/max}H300" stroke="#a77c92" stroke-dasharray="4 4"/><polyline points="${points.join(' ')}" fill="none" stroke="#e88db4" stroke-width="3"/>${points.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="#e88db4"/>`).join('')}</svg><small>${c.start} — ${c.end} · Opening balance is a snapshot, not historical receipts.</small></div>`}
function tick(){if(!$('countdown'))return;let ms=Math.max(0,dt(C().end)-new Date()),d=Math.floor(ms/day),h=Math.floor(ms/3600000)%24,m=Math.floor(ms/60000)%60;$('countdown').textContent=`${d}d ${h}h ${m}m`}setInterval(tick,1000);function hyp(){let c=C(),n=total(c)+Math.max(0,Number($('hyp').value)||0),r=Math.max(0,c.goal-n),d=Math.max(0,diff(c.end,$('hypdate').value));$('hypout').textContent=`${n} packs · ${fmt(n/c.goal*100)}% · ${r} remaining · ${r===0?'0':d?fmt(r/d*7):'—'} packs/week needed`}
function dialog(title,body,fn){let m=$('modal');m.innerHTML=`<form><h2>${title}</h2>${body}<div class="row"><button type="submit">Save</button><button type="button" class="secondary" onclick="document.getElementById('modal').close()">Cancel</button></div></form>`;m.querySelector('form').onsubmit=e=>{e.preventDefault();if(fn(new FormData(e.target))!==false){m.close();save(true)}};m.showModal()}const field=(label,name,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
function entry(id){let c=C(),e=c.entries.find(x=>x.id===id)||{qty:1,status:'received',date:today()};dialog(id?'Edit entry':'Add packs',field('Number of packs','qty',e.qty,'number','min="1" step="1" required')+`<label>Status<select name="status"><option ${e.status==='received'?'selected':''} value="received">Received</option><option ${e.status==='pending'?'selected':''} value="pending">Pending</option></select></label>`+field('Receipt date / expected delivery date','date',e.date,'date','required')+field('Source (optional)','source',e.source)+field('Notes (optional)','notes',e.notes),f=>{let x={...e,id:id||uid(),qty:Number(f.get('qty')),status:f.get('status'),date:f.get('date'),source:f.get('source'),notes:f.get('notes')};if(x.status==='received'&&(x.date>today()||x.date<c.start||x.date>c.end)){alert('Receipt date must be within the challenge and not in the future.');return false}if(id)c.entries=c.entries.map(y=>y.id===id?x:y);else c.entries.push(x)})}function receive(id){let c=C(),e=c.entries.find(x=>x.id===id);dialog('Confirm delivery',field('Actual receipt date','date',today(),'date','required'),f=>{let d=f.get('date');if(d>today()||d<c.start||d>c.end){alert('Choose a valid receipt date within this challenge.');return false}e.status='received';e.date=d;e.delivered=true})}function removeEntry(id){if(confirm('Delete this entry?')){C().entries=C().entries.filter(e=>e.id!==id);save()}}
function reward(id,suggestion=''){let c=C(),r=c.rewards.find(x=>x.id===id)||{at:Math.min(c.goal,100),name:suggestion,icon:'🎀'};dialog('Milestone reward',field('Pack milestone','at',r.at,'number',`min="1" max="${c.goal}" required`)+field('Reward name','name',r.name,'text','required')+`<label>Icon<select name="icon">${['🎀','💗','🧸','🧋','👑','🌸','🎮','🍰','🎁','⭐'].map(i=>`<option ${i===r.icon?'selected':''}>${i}</option>`).join('')}</select></label>`,f=>{let x={...r,id:id||uid(),at:Number(f.get('at')),name:f.get('name'),icon:f.get('icon')};if(id)c.rewards=c.rewards.map(y=>y.id===id?x:y);else c.rewards.push(x)})}function claim(id){let r=C().rewards.find(x=>x.id===id);r.claimed=!r.claimed;save();if(r.claimed&&state.animations)confetti()}function deleteReward(id){if(confirm('Delete reward?')){C().rewards=C().rewards.filter(r=>r.id!==id);save()}}
function challengeEdit(edit=false){let c=edit?C():{name:'New challenge',goal:1000,start:today(),end:add(today(),364)};dialog(edit?'Edit challenge':'New challenge',field('Name','name',c.name,'text','required')+field('Goal','goal',c.goal,'number','min="1" required')+field('Start','start',c.start,'date','required')+field('End / birthday','end',c.end,'date','required'),f=>{let x={name:f.get('name'),goal:Number(f.get('goal')),start:f.get('start'),end:f.get('end')};if(x.start>x.end||edit&&received(c).some(e=>e.date<x.start||e.date>x.end)){alert('Check date range against existing receipts.');return false}if(edit)Object.assign(c,x);else{let id=uid();state.challenges.push({...x,id,entries:[],rewards:[],earned:{}});state.active=id}})}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='birthday-vault-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.challenges)||!x.challenges.length||!x.challenges.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Number.isInteger(c.goal)&&c.goal>0&&/^\d{4}-\d{2}-\d{2}$/.test(c.start)&&/^\d{4}-\d{2}-\d{2}$/.test(c.end)&&Array.isArray(c.entries)&&c.entries.every(e=>/^[\w-]+$/.test(e.id)&&Number.isInteger(e.qty)&&e.qty>0&&['received','pending'].includes(e.status)&&/^\d{4}-\d{2}-\d{2}$/.test(e.date))&&Array.isArray(c.rewards)&&c.rewards.every(r=>/^[\w-]+$/.test(r.id)&&Number.isInteger(r.at)&&typeof r.name==='string')))throw Error();if(confirm('Replace all current vault data with this backup?')){state=x;save()}}catch{alert('Invalid backup file. Current data unchanged.')}}$('challenge').onchange=e=>{state.active=e.target.value;save()};save();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
